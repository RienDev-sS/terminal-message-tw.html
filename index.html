<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>魔法嗶嗶機</title>

	<style>
		:root {
			--bg: #010203;
			--panel: #020506;
			--cyan: #c7f7ff;
			--cyan-soft: rgba(157, 231, 246, 0.42);
			--text: #c4eaf0;
			--muted: #73979e;
			--danger: #d9a6a6;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			width: 100%;
			min-height: 100%;
			background: var(--bg);
		}

		body {
			min-height: 100vh;
			min-height: 100dvh;
			padding:
				max(4px, env(safe-area-inset-top))
				max(4px, env(safe-area-inset-right))
				max(4px, env(safe-area-inset-bottom))
				max(4px, env(safe-area-inset-left));
			overflow: hidden;
			color: var(--text);
			font-family: "Microsoft JhengHei", "PingFang TC", Consolas, monospace;
		}

		.screen {
			position: relative;
			width: 100%;
			min-height: calc(100vh - 8px);
			min-height: calc(100dvh - 8px);
			overflow: hidden;
			border: 1px solid #22282b;
			border-radius: 9px;
			background:
				radial-gradient(circle at center, rgba(41, 66, 71, 0.1), transparent 35%),
				#010203;
		}

		.screen::before {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
			background: repeating-linear-gradient(
				to bottom,
				transparent 0,
				transparent 3px,
				rgba(177, 239, 250, 0.018) 4px
			);
		}

		.status,
		.counter {
			position: absolute;
			top: 16px;
			z-index: 5;
			margin: 0;
			font-size: 11px;
			letter-spacing: 0.09em;
		}

		.status {
			left: 14px;
			color: #bfeff4;
			text-shadow:
				0 0 5px rgba(183, 243, 255, 0.85),
				0 0 12px rgba(120, 222, 240, 0.4);
		}

		.counter {
			right: 14px;
			color: var(--muted);
		}

		.developer-credit,
		.visit-count {
			position: absolute;
			left: 14px;
			z-index: 5;
			margin: 0;
			font-size: 10px;
			letter-spacing: 0.1em;
		}

		.developer-credit {
			top: 37px;
			color: #7fa5ac;
			text-shadow:
				0 0 6px rgba(128, 220, 237, 0.24);
		}

		.visit-count {
			top: 57px;
			color: #58777d;
			font-size: 9px;
			text-shadow:
				0 0 5px rgba(128, 220, 237, 0.18);
		}

		.center {
			position: absolute;
			top: 45%;
			left: 50%;
			display: flex;
			width: min(760px, 92vw);
			flex-direction: column;
			align-items: center;
			transform: translate(-50%, -50%);
		}

		.symbol-wrap {
			position: relative;
			display: grid;
			width: 190px;
			height: 190px;
			place-items: center;
		}

		.symbol-glow {
			position: absolute;
			inset: 27px;
			border-radius: 50%;
			background: rgba(255, 245, 196, 0.17);
			filter: blur(24px);
			animation: glowPulse 2.6s ease-in-out infinite;
		}

		.symbol {
			position: relative;
			z-index: 2;
			display: block;
			width: 155px;
			height: 155px;
			object-fit: contain;
			user-select: none;
			-webkit-user-drag: none;
			filter:
				drop-shadow(0 0 5px rgba(255, 255, 224, 1))
				drop-shadow(0 0 14px rgba(255, 238, 173, 0.85))
				drop-shadow(0 0 26px rgba(202, 240, 255, 0.6));
		}

		.symbol-fallback {
			position: relative;
			z-index: 2;
			display: none;
			font-size: 92px;
			color: #fff1b5;
			text-shadow:
				0 0 8px #fff8d9,
				0 0 22px #ffe9a1,
				0 0 45px #9be8ff;
		}

		.view-button {
			margin-top: 20px;
			min-width: 132px;
			padding: 14px 25px;
			border: 1px solid #17333a;
			border-radius: 4px;
			background: linear-gradient(180deg, #10191c, #050a0c);
			color: #c6edf4;
			font: inherit;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			box-shadow:
				0 0 8px rgba(175, 239, 255, 0.35),
				0 0 25px rgba(144, 228, 247, 0.32),
				0 0 55px rgba(111, 207, 229, 0.18);
			transition:
				transform 0.15s ease,
				box-shadow 0.2s ease,
				background 0.2s ease;
		}

		.view-button:hover {
			background: linear-gradient(180deg, #17262a, #081113);
			box-shadow:
				0 0 12px rgba(197, 247, 255, 0.6),
				0 0 32px rgba(144, 228, 247, 0.46),
				0 0 65px rgba(111, 207, 229, 0.24);
		}

		.view-button:active {
			transform: translateY(2px);
		}

		.view-button:disabled {
			cursor: default;
			opacity: 0.55;
		}

		.terminal-output {
			width: min(700px, 88vw);
			min-height: 138px;
			margin-top: 22px;
			padding: 16px 18px;
			border: 1px solid rgba(155, 233, 248, 0.24);
			border-radius: 4px;
			background: rgba(1, 7, 9, 0.76);
			color: #b9f4ff;
			font-size: 14px;
			line-height: 1.75;
			white-space: pre-wrap;
			box-shadow:
				inset 0 0 22px rgba(94, 200, 223, 0.05),
				0 0 22px rgba(94, 200, 223, 0.08);
			opacity: 0;
			transform: translateY(10px);
			pointer-events: none;
			transition:
				opacity 0.28s ease,
				transform 0.28s ease;
		}

		.terminal-output.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.terminal-output.decoding {
			animation: decodeFlicker 0.11s steps(2) infinite;
		}

		.cursor {
			display: inline-block;
			width: 8px;
			height: 15px;
			margin-left: 3px;
			background: #d4fbff;
			vertical-align: -2px;
			box-shadow: 0 0 8px #9deeff;
			animation: blink 0.75s steps(1) infinite;
		}

		.footer {
			position: absolute;
			right: 0;
			bottom: 0;
			left: 0;
			z-index: 5;
		}

		.footer-line {
			height: 2px;
			background: #b9f7ff;
			box-shadow:
				0 0 4px #c5fbff,
				0 0 10px rgba(122, 224, 245, 0.9),
				0 0 20px rgba(100, 214, 236, 0.55);
		}

		.warning-main {
			display: flex;
			min-height: 35px;
			align-items: center;
			justify-content: center;
			padding: 7px 18px 2px;
			background: #020405;
			color: var(--danger);
			font-size: 12px;
			font-weight: 600;
			text-align: center;
			text-shadow: 0 0 8px rgba(226, 155, 155, 0.35);
		}

		.disclaimer {
			padding: 0 18px 7px;
			background: #020405;
			color: #607a80;
			font-size: 9px;
			text-align: center;
		}

		.flash {
			position: absolute;
			inset: 0;
			z-index: 20;
			background: rgba(186, 244, 255, 0.15);
			opacity: 0;
			pointer-events: none;
		}
.copyright {
	padding: 3px 12px 9px;
	background: #020405;
	color: #4e696f;
	font-size: 9px;
	line-height: 1.5;
	text-align: center;
}
		.flash.active {
			animation: screenFlash 0.24s ease-out;
		}

		@keyframes blink {
			50% {
				opacity: 0;
			}
		}

		@keyframes glowPulse {
			0%,
			100% {
				opacity: 0.7;
				transform: scale(0.96);
			}

			50% {
				opacity: 1;
				transform: scale(1.05);
			}
		}

		@keyframes decodeFlicker {
			0% {
				opacity: 0.78;
				text-shadow:
					2px 0 rgba(133, 238, 255, 0.5),
					-2px 0 rgba(255, 255, 255, 0.15);
			}

			50% {
				opacity: 1;
				text-shadow:
					-1px 0 rgba(133, 238, 255, 0.75),
					1px 0 rgba(255, 255, 255, 0.25);
			}

			100% {
				opacity: 0.88;
				text-shadow:
					1px 0 rgba(133, 238, 255, 0.5),
					-1px 0 rgba(255, 255, 255, 0.18);
			}
		}

		@keyframes screenFlash {
			0% {
				opacity: 0;
			}

			35% {
				opacity: 1;
			}

			100% {
				opacity: 0;
			}
		}

		@media (max-width: 700px), (max-height: 700px) {
			html,
			body {
				min-height: 100%;
			}

			body {
				min-height: 100svh;
				min-height: 100dvh;
				overflow-x: hidden;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}

			.screen {
				display: flex;
				min-height: calc(100svh - 8px);
				min-height: calc(100dvh - 8px);
				flex-direction: column;
				overflow: hidden;
			}

			.status,
			.counter,
			.developer-credit,
			.visit-count {
				font-size: 9px;
			}

			.status {
				top: 14px;
				left: 12px;
				max-width: calc(100% - 120px);
			}

			.developer-credit {
				top: 35px;
				left: 12px;
			}

			.visit-count {
				top: 53px;
				left: 12px;
			}

			.counter {
				top: 14px;
				right: 12px;
			}

			.center {
				position: relative;
				top: auto;
				left: auto;
				width: 100%;
				min-height: 0;
				margin: 0;
				padding:
					84px
					12px
					28px;
				flex: 1 0 auto;
				transform: none;
			}

			.symbol-wrap {
				width: clamp(118px, 34vw, 150px);
				height: clamp(118px, 34vw, 150px);
			}

			.symbol {
				width: clamp(96px, 28vw, 122px);
				height: clamp(96px, 28vw, 122px);
			}

			.symbol-fallback {
				font-size: clamp(58px, 17vw, 70px);
			}

			.view-button {
				margin-top: 12px;
				min-width: 120px;
				padding: 12px 20px;
				font-size: 14px;
			}

			.terminal-output {
				width: min(92vw, 680px);
				min-height: 132px;
				max-height: 34dvh;
				margin-top: 18px;
				padding: 13px 14px;
				overflow-y: auto;
				font-size: 12px;
				line-height: 1.65;
				-webkit-overflow-scrolling: touch;
			}

			.footer {
				position: relative;
				right: auto;
				bottom: auto;
				left: auto;
				width: 100%;
				margin-top: auto;
				flex: 0 0 auto;
			}

			.warning-main {
				min-height: 34px;
				padding: 7px 12px 3px;
				font-size: 10px;
				line-height: 1.45;
			}

			.disclaimer {
				padding:
					1px
					12px
					max(8px, env(safe-area-inset-bottom));
				font-size: 8px;
				line-height: 1.4;
			}
		}

		@media (max-width: 390px) {
			.status {
				max-width: 220px;
				font-size: 8px;
			}

			.counter {
				font-size: 8px;
			}

			.center {
				padding-top: 80px;
				padding-bottom: 20px;
			}

			.terminal-output {
				max-height: 30dvh;
			}
		}

		@media (orientation: landscape) and (max-height: 520px) {
			.screen {
				min-height: 100dvh;
			}

			.center {
				padding-top: 64px;
				padding-bottom: 14px;
			}

			.symbol-wrap {
				width: 92px;
				height: 92px;
			}

			.symbol {
				width: 76px;
				height: 76px;
			}

			.symbol-fallback {
				font-size: 48px;
			}

			.view-button {
				margin-top: 6px;
				padding: 9px 16px;
			}

			.terminal-output {
				min-height: 88px;
				max-height: 28dvh;
				margin-top: 10px;
				font-size: 11px;
			}

			.warning-main {
				min-height: 28px;
				padding-top: 4px;
				font-size: 9px;
			}

			.disclaimer {
				padding-bottom: 4px;
				font-size: 7px;
			}
		}
	</style>
</head>

<body>
	<main class="screen">
		<p id="status" class="status">赫爾墨斯協議尚未開啟...</p>
		<p class="developer-credit">本網站由昭昭開發...</p>
		<p id="visitCount" class="visit-count">VISITOR RECORD 0000</p>
		<div id="counter" class="counter">??? / ???</div>

		<section class="center">
			<div class="symbol-wrap">
				<div class="symbol-glow"></div>

				<img
					id="symbolImage"
					class="symbol"
					src="./assets/symbol.png"
					alt="赫爾墨斯協議標誌"
				>

				<div id="symbolFallback" class="symbol-fallback">⌬</div>
			</div>

			<button id="viewButton" class="view-button" type="button">
				點擊查看
			</button>

			<div
				id="terminalOutput"
				class="terminal-output"
				aria-live="polite"
			></div>
		</section>

		<footer class="footer">
			<div class="footer-line"></div>

			<div class="warning-main">
				警告：如未能完成指令，將在 24 小時內派出代行者進行絞殺。
			</div>
<div class="copyright">
	非官方同人作品｜網站程式與原創文字：@昭昭 2026/07/22
</div>
		</footer>

		<div id="flash" class="flash"></div>
	</main>

	<script>
/*
         * HERMES 動態指令引擎
         * 不依賴 API；使用相容的中文詞庫和句型，即時組合出可執行的任務。
         * 想增加變化：擴充 WORDS 的詞庫，或在 TASK_TEMPLATES 增加句型。
         */
        const WORDS = {
            subjects: ["國文", "英文", "數學", "自然", "社會", "今天正在讀的科目"],
            quickMinutes: ["三", "五", "十"],
            focusMinutes: ["十", "十五", "二十"],
            quantities: ["兩", "三", "四"],
            noteMethods: ["兩句話", "三個關鍵字", "一個簡單的表格", "一張小小的心智圖"],
            questionTypes: ["簡單的", "曾經做錯的", "還不太熟悉的", "最近練習過的"],
            studyActions: ["複習", "重新閱讀", "整理", "回想"],
            studyMaterials: ["手邊的課本", "最近整理的筆記", "今天的講義", "之前做過的練習"],
            readingMaterials: ["手邊的課本", "最近整理的筆記", "今天的講義"],
            studyTargets: ["一個容易忘記的重點", "一個剛學會的觀念", "一項還不熟悉的內容", "一個常考的主題"],
            revisionTopics: ["容易搞混的觀念", "上次寫錯的地方", "新學會的重點", "最需要加強的地方"],
            writingUnits: ["一句話", "兩句話", "三個關鍵字"],
            encouragement: ["今天有好好努力", "慢慢來也算進步", "願意開始就很不錯", "完成一點也是累積"],
            deskItems: ["課本", "筆記本", "文具", "書包裡的物品", "桌面上的小東西"],
            tinyAreas: ["桌面的一個角落", "書包的一個夾層", "手機的首頁", "讀書用品旁邊", "筆袋裡面"],
            smallHabits: ["把水杯放在順手的位置", "確認下一段要讀哪一頁", "把明天要用的筆準備好", "標記一個待完成的進度"],
            happyTopics: ["今天最有趣的事情", "最近讓你開心的一件小事", "今天值得感謝的一件事", "目前最期待的一件小事"],
            imaginations: ["一個會說話的文具", "一個可以暫停時間的書包", "一間開在雲上的圖書館", "一隻愛讀書的小動物", "一張有魔法的便條紙"],
            creativeFormats: ["一句有趣的介紹詞", "一個兩句話的故事", "一句動漫風格台詞", "一個簡單的標語"],
            everydayObjects: ["鉛筆", "橡皮擦", "水杯", "書籤", "耳機", "背包", "便條紙", "手機殼"],
            titles: ["今日冒險者", "專注小隊長", "解題魔法師", "任務探險家", "知識收集員", "靈感觀察員"],
            musicMoods: ["放鬆", "有精神", "溫柔", "懷舊", "開心"],
            songMemories: ["最近喜歡的", "以前常聽的", "讓自己有精神的", "能讓心情平靜的"],
            favoriteMedia: ["喜歡的動漫", "喜歡的電影", "最近看的影片", "玩過的遊戲"],
            mediaTasks: ["挑出一個喜歡的角色", "說出最喜歡的一個場景", "用一句話推薦給朋友", "想一個有趣的續集名稱"],
            quickDoodles: ["一顆星星", "一朵花", "一隻小貓", "一個笑臉", "一個神祕符號", "一個迷你徽章"],
            friendTopics: ["最近聽到的一首歌", "今天學到的小知識", "一個可愛的貼圖", "一件值得開心的小事", "最近想玩的遊戲"],
            compliments: ["謝謝你願意陪我", "跟你聊天很開心", "你今天很努力", "我很珍惜我們的相處", "希望你今天順利"],
            easyQuestions: ["今天過得怎麼樣？", "最近有沒有喜歡的歌？", "今天最開心的事是什麼？", "現在比較想休息還是聊天？"],
            romanceMessages: ["今天有想到你", "跟你一起相處很開心", "我很喜歡和你聊天", "你對我來說很特別"],
            rewardIdeas: ["一顆糖果", "五分鐘自由休息", "一首自己選的歌", "一句給自己的稱讚", "一張自己畫的小獎章"],
            restfulActivities: ["喝幾口水", "起身走動一下", "伸展肩膀", "眺望遠方", "放下手機休息眼睛", "慢慢整理桌面"],
            observationThings: ["窗外的天空", "桌上的一本書", "身旁的光影", "今天的天氣", "眼前的一個小物品"],
            observationDetails: ["三個小細節", "一個平常忽略的特徵", "兩個不同的顏色", "一個讓你感到有趣的地方"],
            gameGenres: ["雙人合作", "解謎", "冒險", "休閒", "節奏", "劇情"],
            reviewOptions: ["今天讀過的一小段內容", "上次不會的一題", "一個熟悉的公式", "前幾天學到的單字"],
            feelings: ["開心", "平靜", "有點疲累", "充滿精神", "期待", "需要休息"],
            futureMoments: ["今天睡前", "明天起床後", "下一次讀書前", "這週結束前"],
            tinyGoals: ["完成一道練習題", "整理三個重點", "讀完兩頁內容", "複習五個單字", "看懂一段不熟悉的解說"]
        };

        const pick = (items) => items[Math.floor(Math.random() * items.length)];

        // 每個句型只選擇語意相容的詞庫；不做「全詞庫亂數拼接」。
        const TASK_TEMPLATES = [
            // 讀書類：佔較高機率，方便在圖書館使用。
            { category: "學習", make: () => `花${pick(WORDS.quickMinutes)}分鐘，${pick(WORDS.studyActions)}${pick(WORDS.studyMaterials)}裡的${pick(WORDS.studyTargets)}。` },
            { category: "學習", make: () => `從${pick(WORDS.subjects)}挑一道${pick(WORDS.questionTypes)}題目，先自己試著解，再核對答案。` },
            { category: "學習", make: () => `把${pick(WORDS.subjects)}最近讀過的一個觀念，用${pick(WORDS.noteMethods)}整理起來。` },
            { category: "學習", make: () => `花${pick(WORDS.focusMinutes)}分鐘專心讀${pick(WORDS.subjects)}，中途不用急著看訊息。` },
            { category: "學習", make: () => `從今天的筆記找出${pick(WORDS.quantities)}個關鍵字，試著不看答案說出意思。` },
            { category: "學習", make: () => `挑一個${pick(WORDS.revisionTopics)}，用${pick(WORDS.writingUnits)}寫下你現在的理解。` },

            // 休息類：不會要求出門、開車或做高風險活動。
            { category: "休息", make: () => `放下手邊的事，${pick(WORDS.restfulActivities)}，再決定要不要繼續。` },

            { category: "休息", make: () => `用一句話記錄「${pick(WORDS.happyTopics)}」，讓今天多一個值得記住的瞬間。` },
            { category: "休息", make: () => `看看目前最需要的是喝水、休息還是繼續讀書，選一件適合自己的事。` },

            // 社交類：事先確認對方願意互動，沒有強制回覆。
            { category: "互動", make: () => `如果現在適合聊天，向一位願意互動的朋友分享${pick(WORDS.friendTopics)}。` },
            { category: "互動", make: () => `如果你願意，向一位在乎的人送上一句話：「${pick(WORDS.compliments)}」。` },
            { category: "互動", make: () => `如果對方有空，問一位朋友：「${pick(WORDS.easyQuestions)}」` },
            { category: "互動", make: () => `挑一首你覺得值得推薦的歌曲，在對方願意聽時分享給他。` },
            { category: "互動", make: () => `選一個最近學到的有趣知識，分享給願意聽的人。` },
            { category: "互動", make: () => `如果現在不方便聊天，就寫下一句想對朋友說的話，改天再分享。` },

            // 心意類：稀有彩蛋，完全自願；不需要對方答應或擁抱。
            { category: "心意", make: () => `如果你願意，可以對喜歡的人說：「${pick(WORDS.romanceMessages)}」。` },
            { category: "心意", make: () => `想一件與喜歡的人相處時開心的小事，寫下一句回憶。` },
            { category: "心意", make: () => `如果彼此都願意，邀請喜歡的人一起聽一首歌或聊聊天。` },
            { category: "心意", make: () => `如果你想表達心意，寫一句真誠的話；要不要送出，可以自己決定。` },
            { category: "心意", make: () => `如果你真的想說，可以對喜歡的人說「我愛你」，也尊重對方當下的回應和感受。` }
        ];

        // 不同類型出現的權重：讓讀書任務相對常見，戀愛彩蛋比較稀有。
        const CATEGORY_WEIGHTS = {
            "學習": 35, "生活": 13, "創意": 13, "休閒": 12,
            "休息": 12, "互動": 11, "心意": 4
        };

        const historyStorageKey = "hermes-generated-command-history-v1";
        const countStorageKey = "hermes-generated-command-count-v1";
        const MAX_HISTORY = 200;
        let recentCommands = readHistory();
        let generatedCount = readCount();
        let lastCategory = "";
        let lastTemplateIndex = -1;

        function readHistory() {
            try {
                const saved = JSON.parse(localStorage.getItem(historyStorageKey) || "[]");
                return Array.isArray(saved) ? saved.filter((s) => typeof s === "string").slice(-MAX_HISTORY) : [];
            } catch (error) { return []; }
        }

        function readCount() {
            try {
                const number = Number(localStorage.getItem(countStorageKey) || 0);
                return Number.isFinite(number) && number >= 0 ? Math.floor(number) : 0;
            } catch (error) { return 0; }
        }

        function saveGenerationState() {
            try {
                localStorage.setItem(historyStorageKey, JSON.stringify(recentCommands));
                localStorage.setItem(countStorageKey, String(generatedCount));
            } catch (error) {
                console.warn("無法儲存產生紀錄：", error);
            }
        }

        function chooseTemplate() {
            const categories = Object.keys(CATEGORY_WEIGHTS);
            let category;
            // 降低連續抽到同一類的機率，仍保留一點驚喜。
            const eligible = categories.filter((c) => c !== lastCategory);
            const totalWeight = eligible.reduce((sum, c) => sum + CATEGORY_WEIGHTS[c], 0);
            let roll = Math.random() * totalWeight;
            category = eligible[eligible.length - 1];
            for (const c of eligible) {
                roll -= CATEGORY_WEIGHTS[c];
                if (roll < 0) { category = c; break; }
            }
            const candidates = TASK_TEMPLATES
                .map((template, index) => ({...template, index}))
                .filter((template) => template.category === category && template.index !== lastTemplateIndex);
            return pick(candidates.length ? candidates : TASK_TEMPLATES.map((template, index) => ({...template, index})));
        }

        function generateCommand() {
            let result = "";
            let chosen = null;
            // 最多重新生成 80 次，避免近期重複。即使詞庫未來縮小也不會卡住。
            for (let attempt = 0; attempt < 80; attempt += 1) {
                const template = chooseTemplate();
                const text = "致:" + template.make();
                if (!recentCommands.includes(text)) {
                    result = text;
                    chosen = template;
                    break;
                }
            }
            if (!chosen) {
                chosen = chooseTemplate();
                result = "致:" + chosen.make();
            }
            lastCategory = chosen.category;
            lastTemplateIndex = chosen.index;
            recentCommands.push(result);
            recentCommands = recentCommands.slice(-MAX_HISTORY);
            generatedCount += 1;
            saveGenerationState();
            return result;
        }

		const scrambleSymbols = Array.from(
			"▓▒░01<>[]{}#$%&*+=?/\\ΔΩ※ЖЯΞλβ"
		);

		const viewButton = document.getElementById("viewButton");
		const terminalOutput = document.getElementById("terminalOutput");
		const flash = document.getElementById("flash");
		const statusText = document.getElementById("status");
		const visitCountText = document.getElementById("visitCount");
		const counter = document.getElementById("counter");
		const symbolImage = document.getElementById("symbolImage");
		const symbolFallback = document.getElementById("symbolFallback");

		const visitStorageKey = "hermes-local-visit-count-v1";

        let audioContext = null;
        let terminalNoiseBuffer = null;
        let isDecoding = false;

        function wait(milliseconds) {
			return new Promise(function (resolve) {
				setTimeout(resolve, milliseconds);
			});
		}

		function updateVisitCount() {
			let visitCount = 0;

			try {
				visitCount = Number(
					localStorage.getItem(
						visitStorageKey
					)
				);

				if (
					!Number.isFinite(visitCount) ||
					visitCount < 0
				) {
					visitCount = 0;
				}

				visitCount += 1;

				localStorage.setItem(
					visitStorageKey,
					String(visitCount)
				);
			} catch (error) {
				console.warn(
					"無法讀取訪問紀錄：",
					error
				);

				visitCount = 1;
			}

			visitCountText.textContent =
				"VISITOR RECORD " +
				String(visitCount).padStart(
					4,
					"0"
				);
		}

		function updateCounter() {
            // 動態生成不存在「指令庫耗盡」，計數只表示這台裝置抽了幾次。
            counter.textContent = String(generatedCount).padStart(4, "0") + " / ∞";
        }

        function ensureAudioContext() {
            const Context = window.AudioContext || window.webkitAudioContext;
            if (!Context) return false;
            try {
                audioContext ??= new Context();
                if (audioContext.state === "suspended") {
                    audioContext.resume().catch(() => {});
                }
                return true;
            } catch (error) {
                return false;
            }
        }

		function playTone(
			frequency,
			duration,
			delay = 0,
			type = "sine",
			volume = 0.04
		) {
			if (!ensureAudioContext()) return;

			const startTime =
				audioContext.currentTime + delay;

			const oscillator =
				audioContext.createOscillator();

			const gain =
				audioContext.createGain();

			oscillator.type = type;
			oscillator.frequency.setValueAtTime(
				frequency,
				startTime
			);

			gain.gain.setValueAtTime(
				volume,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + duration
			);

			oscillator.connect(gain);
			gain.connect(audioContext.destination);

			oscillator.start(startTime);
			oscillator.stop(startTime + duration);
		}

		function playButtonBeeps() {
			playTone(900, 0.075, 0, "square", 0.032);
			playTone(1180, 0.085, 0.1, "square", 0.028);
		}

		function getTerminalNoiseBuffer() {
			if (!ensureAudioContext()) return null;

			if (terminalNoiseBuffer) {
				return terminalNoiseBuffer;
			}

			const duration = 0.045;
			const frameCount = Math.floor(
				audioContext.sampleRate * duration
			);

			terminalNoiseBuffer =
				audioContext.createBuffer(
					1,
					frameCount,
					audioContext.sampleRate
				);

			const channel =
				terminalNoiseBuffer.getChannelData(0);

			for (
				let index = 0;
				index < frameCount;
				index += 1
			) {
				const progress =
					index / frameCount;

				const decay =
					Math.pow(1 - progress, 4);

				channel[index] =
					(Math.random() * 2 - 1) *
					decay;
			}

			return terminalNoiseBuffer;
		}

		function playTerminalNoiseClick(
			delay = 0,
			volume = 0.006
		) {
			if (!ensureAudioContext()) return;

			const startTime =
				audioContext.currentTime + delay;

			const source =
				audioContext.createBufferSource();

			const bandPass =
				audioContext.createBiquadFilter();

			const highPass =
				audioContext.createBiquadFilter();

			const gain =
				audioContext.createGain();

			source.buffer =
				getTerminalNoiseBuffer();

			bandPass.type = "bandpass";
			bandPass.frequency.setValueAtTime(
				2350 + Math.random() * 900,
				startTime
			);
			bandPass.Q.setValueAtTime(
				1.4,
				startTime
			);

			highPass.type = "highpass";
			highPass.frequency.setValueAtTime(
				900,
				startTime
			);

			gain.gain.setValueAtTime(
				volume,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + 0.032
			);

			source.connect(bandPass);
			bandPass.connect(highPass);
			highPass.connect(gain);
			gain.connect(audioContext.destination);

			source.start(startTime);
			source.stop(startTime + 0.04);
		}

		function playTerminalGlyphSound(step) {
			if (!ensureAudioContext()) return;

			const pattern = [
				0,
				42,
				-26,
				73,
				15,
				-38,
				55
			];

			const baseFrequency =
				620 +
				pattern[
					step % pattern.length
				];

			const startTime =
				audioContext.currentTime;

			const oscillator =
				audioContext.createOscillator();

			const lowPass =
				audioContext.createBiquadFilter();

			const gain =
				audioContext.createGain();

			oscillator.type = "square";

			oscillator.frequency.setValueAtTime(
				baseFrequency + 145,
				startTime
			);

			oscillator.frequency.exponentialRampToValueAtTime(
				baseFrequency,
				startTime + 0.026
			);

			lowPass.type = "lowpass";
			lowPass.frequency.setValueAtTime(
				1850,
				startTime
			);
			lowPass.Q.setValueAtTime(
				0.7,
				startTime
			);

			gain.gain.setValueAtTime(
				0.0105,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + 0.031
			);

			oscillator.connect(lowPass);
			lowPass.connect(gain);
			gain.connect(audioContext.destination);

			oscillator.start(startTime);
			oscillator.stop(startTime + 0.034);

			playTerminalNoiseClick(
				0,
				0.0055
			);

			if (step % 7 === 0) {
				playTone(
					baseFrequency + 260,
					0.016,
					0.024,
					"square",
					0.0045
				);

				playTerminalNoiseClick(
					0.022,
					0.0035
				);
			}
		}

		function playCompleteSound() {
			playTone(520, 0.12, 0, "sine", 0.04);
			playTone(690, 0.14, 0.09, "sine", 0.042);
			playTone(920, 0.19, 0.2, "sine", 0.038);
		}

		function getRandomSymbol() {
			return scrambleSymbols[
				Math.floor(
					Math.random() *
					scrambleSymbols.length
				)
			];
		}

		function shouldKeepCharacter(character) {
			return (
				character === " " ||
				character === "\n" ||
				/[，。！？、：；「」『』（）【】0-9]/.test(
					character
				)
			);
		}

		function buildScrambledText(
			characters,
			revealedCount
		) {
			return characters
				.map(function (character, index) {
					if (
						index < revealedCount ||
						shouldKeepCharacter(character)
					) {
						return character;
					}

					return getRandomSymbol();
				})
				.join("");
		}

		function renderDecodeScreen(
			scrambledText,
			progress
		) {
			const percent = String(
				Math.floor(progress * 100)
			).padStart(3, "0");

			terminalOutput.textContent =
				"[HERMES] 指令封包已接收\n" +
				"[DECODE] 解密進度：" +
				percent +
				"%\n\n" +
				scrambledText;
		}

		async function decodeCommand(command) {
			const completeText =
				"【本次指令】\n" + command;

			const characters =
				Array.from(completeText);

			const totalFrames =
				Math.max(
					54,
					characters.length * 2
				);

			terminalOutput.classList.add("decoding");

			for (
				let frame = 0;
				frame <= totalFrames;
				frame += 1
			) {
				const progress =
					frame / totalFrames;

				const easedProgress =
					1 -
					Math.pow(
						1 - progress,
						2.35
					);

				const revealedCount =
					Math.floor(
						easedProgress *
						characters.length
					);

				renderDecodeScreen(
					buildScrambledText(
						characters,
						revealedCount
					),
					progress
				);

				if (frame % 2 === 0) {
					playTerminalGlyphSound(
						Math.floor(frame / 2)
					);
				}

				await wait(
					30 + Math.random() * 20
				);
			}

			terminalOutput.classList.remove("decoding");

			terminalOutput.textContent =
				"[HERMES] 解密完成\n" +
				"[STATUS] 指令已正式生效\n\n" +
				completeText;

			const cursor =
				document.createElement("span");

			cursor.className = "cursor";
			terminalOutput.appendChild(cursor);

			playCompleteSound();
		}

		viewButton.addEventListener(
			"click",
			async function () {
				if (isDecoding) return;

				const command =
					generateCommand();

				if (!command) return;

				isDecoding = true;
				viewButton.disabled = true;
				viewButton.textContent = "接收中...";

				statusText.textContent =
					"赫爾墨斯協議：正在接收未知封包...";

				playButtonBeeps();

				flash.classList.remove("active");
				void flash.offsetWidth;
				flash.classList.add("active");

				terminalOutput.classList.add("visible");
				terminalOutput.textContent =
					"[SIGNAL] 偵測到未知封包...\n" +
					"[STATUS] 正在建立解密程序...";

				await wait(520);
				await decodeCommand(command);

				statusText.textContent =
					"赫爾墨斯協議：等待下一次調用。";

				viewButton.textContent =
					"查看下一項指令";

				viewButton.disabled = false;
				isDecoding = false;

				updateCounter();
			}
		);

		symbolImage.addEventListener("error", function () {
			symbolImage.style.display = "none";
			symbolFallback.style.display = "block";
		});

		updateVisitCount();
		updateCounter();
	</script>
