<script>
	const commands = [
		"在二十四小時內看完一部最喜歡的動漫，並記錄最喜歡的三個片段。",
		"在今晚十二點以前，關閉所有通知十分鐘，直到倒數完全結束。",
		"選擇一首最熟悉的歌曲，戴上耳機並閉眼完整聽完一次。",
		"在明天日落以前，拍下一張畫面中沒有任何人的街景。",
		"從房間裡找出一件超過一年沒有碰過的物品，寫下它原本的用途。",
		"在凌晨一點以前，關閉房間主燈並安靜坐著三分鐘，只聆聽周圍的聲音。",
		"在二十四小時內完成一件從來沒有嘗試過的小型作品。",
		"寫下一句從未告訴過任何人的話，將它儲存在只有自己知道的位置。",
		"在明天以前，重新觀看一段對自己影響最深的影片，並寫下觀看後的想法。",
		"選擇一個熟悉的房間，在不開主燈的情況下觀察一分鐘，記住其中五個物件。",
		"在二十四小時內整理一個長時間沒有打開的資料夾，刪除至少十個不需要的檔案。",
		"在今天結束以前，完成一件拖延超過七天但能在三十分鐘內完成的事情。"
	];

	const scrambleSymbols = Array.from(
		"▓▒░01<>[]{}#$%&*+=?/\\ΔΩ※ЖЯ"
	);

	const viewButton =
		document.getElementById("viewButton");

	const terminalOutput =
		document.getElementById("terminalOutput");

	const flash =
		document.getElementById("flash");

	let audioContext = null;
	let lastCommandIndex = -1;
	let isDecoding = false;

	function wait(milliseconds) {
		return new Promise(function (resolve) {
			setTimeout(resolve, milliseconds);
		});
	}

	function ensureAudioContext() {
		audioContext ??= new AudioContext();

		if (audioContext.state === "suspended") {
			audioContext.resume();
		}
	}

	function playTone(
		frequency,
		duration,
		delay = 0,
		type = "sine",
		volume = 0.04
	) {
		ensureAudioContext();

		const startTime =
			audioContext.currentTime + delay;

		const oscillator =
			audioContext.createOscillator();

		const gain =
			audioContext.createGain();

		oscillator.type = type;
		oscillator.frequency.setValueAtTime(
			frequency,
			startTime
		);

		gain.gain.setValueAtTime(
			volume,
			startTime
		);

		gain.gain.exponentialRampToValueAtTime(
			0.001,
			startTime + duration
		);

		oscillator.connect(gain);
		gain.connect(audioContext.destination);

		oscillator.start(startTime);
		oscillator.stop(startTime + duration);
	}

	function playButtonBeeps() {
		playTone(850, 0.08, 0, "square", 0.035);
		playTone(1120, 0.09, 0.11, "square", 0.03);
	}

	function playDecodeNote(step) {
		const frequencies = [
			410,
			510,
			610,
			510
		];

		const frequency =
			frequencies[
				step % frequencies.length
			];

		playTone(
			frequency,
			0.11,
			0,
			"sine",
			0.025
		);
	}

	function playDecodeComplete() {
		playTone(520, 0.13, 0, "sine", 0.04);
		playTone(680, 0.15, 0.1, "sine", 0.045);
		playTone(880, 0.2, 0.21, "sine", 0.04);
	}

	function getRandomCommand() {
		let index;

		do {
			index = Math.floor(
				Math.random() * commands.length
			);
		} while (
			commands.length > 1 &&
			index === lastCommandIndex
		);

		lastCommandIndex = index;

		return commands[index];
	}

	function getRandomSymbol() {
		const index = Math.floor(
			Math.random() *
			scrambleSymbols.length
		);

		return scrambleSymbols[index];
	}

	function shouldKeepCharacter(character) {
		return (
			character === " " ||
			character === "\n" ||
			/[，。！？、：；「」『』（）【】0-9]/.test(
				character
			)
		);
	}

	function buildScrambledText(
		characters,
		revealedCount
	) {
		return characters
			.map(function (character, index) {
				if (
					index < revealedCount ||
					shouldKeepCharacter(character)
				) {
					return character;
				}

				return getRandomSymbol();
			})
			.join("");
	}

	function renderDecodeScreen(
		scrambledText,
		progress
	) {
		const percent = String(
			Math.floor(progress * 100)
		).padStart(2, "0");

		terminalOutput.textContent =
			"[PROTOCOL] 指令封包已接收\n" +
			"[DECODE] 解密進度：" +
			percent +
			"%\n\n" +
			scrambledText;
	}

	async function decodeCommand(command) {
		const prefix =
			"【本次指令】\n";

		const completeText =
			prefix + command;

		const characters =
			Array.from(completeText);

		const totalFrames =
			Math.max(
				36,
				characters.length * 2
			);

		terminalOutput.classList.add(
			"decoding"
		);

		for (
			let frame = 0;
			frame <= totalFrames;
			frame += 1
		) {
			const progress =
				frame / totalFrames;

			const easedProgress =
				1 -
				Math.pow(
					1 - progress,
					2.4
				);

			const revealedCount =
				Math.floor(
					easedProgress *
					characters.length
				);

			const scrambledText =
				buildScrambledText(
					characters,
					revealedCount
				);

			renderDecodeScreen(
				scrambledText,
				progress
			);

			if (frame % 5 === 0) {
				playDecodeNote(
					Math.floor(frame / 5)
				);
			}

			await wait(
				34 + Math.random() * 22
			);
		}

		terminalOutput.classList.remove(
			"decoding"
		);

		terminalOutput.textContent =
			"[PROTOCOL] 解密完成\n" +
			"[STATUS] 指令已正式生效\n\n" +
			completeText;

		const cursor =
			document.createElement("span");

		cursor.className = "cursor";
		terminalOutput.appendChild(cursor);

		playDecodeComplete();
	}

	viewButton.addEventListener(
		"click",
		async function () {
			if (isDecoding) return;

			isDecoding = true;
			viewButton.disabled = true;
			viewButton.textContent =
				"接收中...";

			playButtonBeeps();

			flash.classList.remove(
				"active"
			);

			void flash.offsetWidth;

			flash.classList.add(
				"active"
			);

			terminalOutput.classList.add(
				"visible"
			);

			terminalOutput.textContent =
				"[SIGNAL] 偵測到未知封包...\n" +
				"[STATUS] 等待解密程序啟動...";

			await wait(550);

			const command =
				getRandomCommand();

			await decodeCommand(command);

			viewButton.textContent =
				"查看下一項指令";

			viewButton.disabled = false;
			isDecoding = false;
		}
	);
</script>
