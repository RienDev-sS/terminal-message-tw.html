<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>魔法嗶嗶機</title>

	<style>
		:root {
			--bg: #010203;
			--panel: #020506;
			--cyan: #c7f7ff;
			--cyan-soft: rgba(157, 231, 246, 0.42);
			--text: #c4eaf0;
			--muted: #73979e;
			--danger: #d9a6a6;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			width: 100%;
			min-height: 100%;
			background: var(--bg);
		}

		body {
			min-height: 100vh;
			min-height: 100dvh;
			padding:
				max(4px, env(safe-area-inset-top))
				max(4px, env(safe-area-inset-right))
				max(4px, env(safe-area-inset-bottom))
				max(4px, env(safe-area-inset-left));
			overflow: hidden;
			color: var(--text);
			font-family: "Microsoft JhengHei", "PingFang TC", Consolas, monospace;
		}

		.screen {
			position: relative;
			width: 100%;
			min-height: calc(100vh - 8px);
			min-height: calc(100dvh - 8px);
			overflow: hidden;
			border: 1px solid #22282b;
			border-radius: 9px;
			background:
				radial-gradient(circle at center, rgba(41, 66, 71, 0.1), transparent 35%),
				#010203;
		}

		.screen::before {
			content: "";
			position: absolute;
			inset: 0;
			pointer-events: none;
			background: repeating-linear-gradient(
				to bottom,
				transparent 0,
				transparent 3px,
				rgba(177, 239, 250, 0.018) 4px
			);
		}

		.status,
		.counter {
			position: absolute;
			top: 16px;
			z-index: 5;
			margin: 0;
			font-size: 11px;
			letter-spacing: 0.09em;
		}

		.status {
			left: 14px;
			color: #bfeff4;
			text-shadow:
				0 0 5px rgba(183, 243, 255, 0.85),
				0 0 12px rgba(120, 222, 240, 0.4);
		}

		.counter {
			right: 14px;
			color: var(--muted);
		}

		.developer-credit,
		.visit-count {
			position: absolute;
			left: 14px;
			z-index: 5;
			margin: 0;
			font-size: 10px;
			letter-spacing: 0.1em;
		}

		.developer-credit {
			top: 37px;
			color: #7fa5ac;
			text-shadow:
				0 0 6px rgba(128, 220, 237, 0.24);
		}

		.visit-count {
			top: 57px;
			color: #58777d;
			font-size: 9px;
			text-shadow:
				0 0 5px rgba(128, 220, 237, 0.18);
		}

		.center {
			position: absolute;
			top: 45%;
			left: 50%;
			display: flex;
			width: min(760px, 92vw);
			flex-direction: column;
			align-items: center;
			transform: translate(-50%, -50%);
		}

		.symbol-wrap {
			position: relative;
			display: grid;
			width: 190px;
			height: 190px;
			place-items: center;
		}

		.symbol-glow {
			position: absolute;
			inset: 27px;
			border-radius: 50%;
			background: rgba(255, 245, 196, 0.17);
			filter: blur(24px);
			animation: glowPulse 2.6s ease-in-out infinite;
		}

		.symbol {
			position: relative;
			z-index: 2;
			display: block;
			width: 155px;
			height: 155px;
			object-fit: contain;
			user-select: none;
			-webkit-user-drag: none;
			filter:
				drop-shadow(0 0 5px rgba(255, 255, 224, 1))
				drop-shadow(0 0 14px rgba(255, 238, 173, 0.85))
				drop-shadow(0 0 26px rgba(202, 240, 255, 0.6));
		}

		.symbol-fallback {
			position: relative;
			z-index: 2;
			display: none;
			font-size: 92px;
			color: #fff1b5;
			text-shadow:
				0 0 8px #fff8d9,
				0 0 22px #ffe9a1,
				0 0 45px #9be8ff;
		}

		.view-button {
			margin-top: 20px;
			min-width: 132px;
			padding: 14px 25px;
			border: 1px solid #17333a;
			border-radius: 4px;
			background: linear-gradient(180deg, #10191c, #050a0c);
			color: #c6edf4;
			font: inherit;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			box-shadow:
				0 0 8px rgba(175, 239, 255, 0.35),
				0 0 25px rgba(144, 228, 247, 0.32),
				0 0 55px rgba(111, 207, 229, 0.18);
			transition:
				transform 0.15s ease,
				box-shadow 0.2s ease,
				background 0.2s ease;
		}

		.view-button:hover {
			background: linear-gradient(180deg, #17262a, #081113);
			box-shadow:
				0 0 12px rgba(197, 247, 255, 0.6),
				0 0 32px rgba(144, 228, 247, 0.46),
				0 0 65px rgba(111, 207, 229, 0.24);
		}

		.view-button:active {
			transform: translateY(2px);
		}

		.view-button:disabled {
			cursor: default;
			opacity: 0.55;
		}

		.terminal-output {
			width: min(700px, 88vw);
			min-height: 138px;
			margin-top: 22px;
			padding: 16px 18px;
			border: 1px solid rgba(155, 233, 248, 0.24);
			border-radius: 4px;
			background: rgba(1, 7, 9, 0.76);
			color: #b9f4ff;
			font-size: 14px;
			line-height: 1.75;
			white-space: pre-wrap;
			box-shadow:
				inset 0 0 22px rgba(94, 200, 223, 0.05),
				0 0 22px rgba(94, 200, 223, 0.08);
			opacity: 0;
			transform: translateY(10px);
			pointer-events: none;
			transition:
				opacity 0.28s ease,
				transform 0.28s ease;
		}

		.terminal-output.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.terminal-output.decoding {
			animation: decodeFlicker 0.11s steps(2) infinite;
		}

		.cursor {
			display: inline-block;
			width: 8px;
			height: 15px;
			margin-left: 3px;
			background: #d4fbff;
			vertical-align: -2px;
			box-shadow: 0 0 8px #9deeff;
			animation: blink 0.75s steps(1) infinite;
		}

		.footer {
			position: absolute;
			right: 0;
			bottom: 0;
			left: 0;
			z-index: 5;
		}

		.footer-line {
			height: 2px;
			background: #b9f7ff;
			box-shadow:
				0 0 4px #c5fbff,
				0 0 10px rgba(122, 224, 245, 0.9),
				0 0 20px rgba(100, 214, 236, 0.55);
		}

		.warning-main {
			display: flex;
			min-height: 35px;
			align-items: center;
			justify-content: center;
			padding: 7px 18px 2px;
			background: #020405;
			color: var(--danger);
			font-size: 12px;
			font-weight: 600;
			text-align: center;
			text-shadow: 0 0 8px rgba(226, 155, 155, 0.35);
		}

		.disclaimer {
			padding: 0 18px 7px;
			background: #020405;
			color: #607a80;
			font-size: 9px;
			text-align: center;
		}

		.flash {
			position: absolute;
			inset: 0;
			z-index: 20;
			background: rgba(186, 244, 255, 0.15);
			opacity: 0;
			pointer-events: none;
		}
.copyright {
	padding: 3px 12px 9px;
	background: #020405;
	color: #4e696f;
	font-size: 9px;
	line-height: 1.5;
	text-align: center;
}
		.flash.active {
			animation: screenFlash 0.24s ease-out;
		}

		@keyframes blink {
			50% {
				opacity: 0;
			}
		}

		@keyframes glowPulse {
			0%,
			100% {
				opacity: 0.7;
				transform: scale(0.96);
			}

			50% {
				opacity: 1;
				transform: scale(1.05);
			}
		}

		@keyframes decodeFlicker {
			0% {
				opacity: 0.78;
				text-shadow:
					2px 0 rgba(133, 238, 255, 0.5),
					-2px 0 rgba(255, 255, 255, 0.15);
			}

			50% {
				opacity: 1;
				text-shadow:
					-1px 0 rgba(133, 238, 255, 0.75),
					1px 0 rgba(255, 255, 255, 0.25);
			}

			100% {
				opacity: 0.88;
				text-shadow:
					1px 0 rgba(133, 238, 255, 0.5),
					-1px 0 rgba(255, 255, 255, 0.18);
			}
		}

		@keyframes screenFlash {
			0% {
				opacity: 0;
			}

			35% {
				opacity: 1;
			}

			100% {
				opacity: 0;
			}
		}

		@media (max-width: 700px), (max-height: 700px) {
			html,
			body {
				min-height: 100%;
			}

			body {
				min-height: 100svh;
				min-height: 100dvh;
				overflow-x: hidden;
				overflow-y: auto;
				-webkit-overflow-scrolling: touch;
			}

			.screen {
				display: flex;
				min-height: calc(100svh - 8px);
				min-height: calc(100dvh - 8px);
				flex-direction: column;
				overflow: hidden;
			}

			.status,
			.counter,
			.developer-credit,
			.visit-count {
				font-size: 9px;
			}

			.status {
				top: 14px;
				left: 12px;
				max-width: calc(100% - 120px);
			}

			.developer-credit {
				top: 35px;
				left: 12px;
			}

			.visit-count {
				top: 53px;
				left: 12px;
			}

			.counter {
				top: 14px;
				right: 12px;
			}

			.center {
				position: relative;
				top: auto;
				left: auto;
				width: 100%;
				min-height: 0;
				margin: 0;
				padding:
					84px
					12px
					28px;
				flex: 1 0 auto;
				transform: none;
			}

			.symbol-wrap {
				width: clamp(118px, 34vw, 150px);
				height: clamp(118px, 34vw, 150px);
			}

			.symbol {
				width: clamp(96px, 28vw, 122px);
				height: clamp(96px, 28vw, 122px);
			}

			.symbol-fallback {
				font-size: clamp(58px, 17vw, 70px);
			}

			.view-button {
				margin-top: 12px;
				min-width: 120px;
				padding: 12px 20px;
				font-size: 14px;
			}

			.terminal-output {
				width: min(92vw, 680px);
				min-height: 132px;
				max-height: 34dvh;
				margin-top: 18px;
				padding: 13px 14px;
				overflow-y: auto;
				font-size: 12px;
				line-height: 1.65;
				-webkit-overflow-scrolling: touch;
			}

			.footer {
				position: relative;
				right: auto;
				bottom: auto;
				left: auto;
				width: 100%;
				margin-top: auto;
				flex: 0 0 auto;
			}

			.warning-main {
				min-height: 34px;
				padding: 7px 12px 3px;
				font-size: 10px;
				line-height: 1.45;
			}

			.disclaimer {
				padding:
					1px
					12px
					max(8px, env(safe-area-inset-bottom));
				font-size: 8px;
				line-height: 1.4;
			}
		}

		@media (max-width: 390px) {
			.status {
				max-width: 220px;
				font-size: 8px;
			}

			.counter {
				font-size: 8px;
			}

			.center {
				padding-top: 80px;
				padding-bottom: 20px;
			}

			.terminal-output {
				max-height: 30dvh;
			}
		}

		@media (orientation: landscape) and (max-height: 520px) {
			.screen {
				min-height: 100dvh;
			}

			.center {
				padding-top: 64px;
				padding-bottom: 14px;
			}

			.symbol-wrap {
				width: 92px;
				height: 92px;
			}

			.symbol {
				width: 76px;
				height: 76px;
			}

			.symbol-fallback {
				font-size: 48px;
			}

			.view-button {
				margin-top: 6px;
				padding: 9px 16px;
			}

			.terminal-output {
				min-height: 88px;
				max-height: 28dvh;
				margin-top: 10px;
				font-size: 11px;
			}

			.warning-main {
				min-height: 28px;
				padding-top: 4px;
				font-size: 9px;
			}

			.disclaimer {
				padding-bottom: 4px;
				font-size: 7px;
			}
		}
	</style>
</head>

	<script>
		const commands = [

   "致:播放一首你/妳喜歡的音樂，跟你/妳喜歡的人一起聽完",
   "致:選一段最熟悉的中二台詞，模仿一遍",

   "致:今天放鬆休息好好的獎勵自己",
   "致:向陪伴的人說出妳/你現在最想要做什麼",
   "致:向喜歡的人說出你/妳喜歡什麼",
   "致:什麼都不要做，休息五分鐘",
   "致:找到一款想玩的遊戲",
   "致:用一句話描述此刻空氣的溫度、氣味與聲音。",
   "致:把圓周率算完才可以回家",
   "致:對你喜歡的人說'我愛你'並得到他的擁抱",
   "致:如果此時妳/你的心情不太好，就找一個願意陪你的人宣洩情緒",
   "致:找一個人說出至今為止你/妳認為做過最白癡的事情",
	"致:去超商或者居酒屋喝酒",
    "致: 把相簿裡面妳/你覺得最有趣的一張照片給喜歡的人看"
			
];

		const scrambleSymbols = Array.from(
			"▓▒░01<>[]{}#$%&*+=?/\\ΔΩ※ЖЯΞλβ"
		);

		const viewButton = document.getElementById("viewButton");
		const terminalOutput = document.getElementById("terminalOutput");
		const flash = document.getElementById("flash");
		const statusText = document.getElementById("status");
		const visitCountText = document.getElementById("visitCount");
		const counter = document.getElementById("counter");
		const symbolImage = document.getElementById("symbolImage");
		const symbolFallback = document.getElementById("symbolFallback");

		const storageKey = "hermes-terminal-used-v1";
		const visitStorageKey = "hermes-local-visit-count-v1";

		let audioContext = null;
		let terminalNoiseBuffer = null;
		let isDecoding = false;
		let usedIndexes = loadUsedIndexes();

		function wait(milliseconds) {
			return new Promise(function (resolve) {
				setTimeout(resolve, milliseconds);
			});
		}

		function updateVisitCount() {
			let visitCount = 0;

			try {
				visitCount = Number(
					localStorage.getItem(
						visitStorageKey
					)
				);

				if (
					!Number.isFinite(visitCount) ||
					visitCount < 0
				) {
					visitCount = 0;
				}

				visitCount += 1;

				localStorage.setItem(
					visitStorageKey,
					String(visitCount)
				);
			} catch (error) {
				console.warn(
					"無法讀取訪問紀錄：",
					error
				);

				visitCount = 1;
			}

			visitCountText.textContent =
				"VISITOR RECORD " +
				String(visitCount).padStart(
					4,
					"0"
				);
		}

		function loadUsedIndexes() {
			try {
				const saved = JSON.parse(
					localStorage.getItem(storageKey) || "[]"
				);

				if (!Array.isArray(saved)) return [];

				return saved.filter(function (value) {
					return (
						Number.isInteger(value) &&
						value >= 0 &&
						value < commands.length
					);
				});
			} catch (error) {
				return [];
			}
		}

		function saveUsedIndexes() {
			try {
				localStorage.setItem(
					storageKey,
					JSON.stringify(usedIndexes)
				);
			} catch (error) {
				console.warn("無法儲存指令記錄：", error);
			}
		}

		function updateCounter() {
			const remaining =
				commands.length - usedIndexes.length;

			counter.textContent = "??? / ???";

			if (remaining <= 0) {
				viewButton.disabled = true;
				viewButton.textContent = "指令庫已耗盡";
				statusText.textContent =
					"赫爾墨斯協議：全部指令均已發送。";
			}
		}

		function getUnusedCommand() {
			const available = [];

			for (
				let index = 0;
				index < commands.length;
				index += 1
			) {
				if (!usedIndexes.includes(index)) {
					available.push(index);
				}
			}

			if (available.length === 0) return null;

			const chosenIndex =
				available[
					Math.floor(
						Math.random() *
						available.length
					)
				];

			usedIndexes.push(chosenIndex);
			saveUsedIndexes();
			updateCounter();

			return commands[chosenIndex];
		}

		function ensureAudioContext() {
			audioContext ??= new AudioContext();

			if (audioContext.state === "suspended") {
				audioContext.resume();
			}
		}

		function playTone(
			frequency,
			duration,
			delay = 0,
			type = "sine",
			volume = 0.04
		) {
			ensureAudioContext();

			const startTime =
				audioContext.currentTime + delay;

			const oscillator =
				audioContext.createOscillator();

			const gain =
				audioContext.createGain();

			oscillator.type = type;
			oscillator.frequency.setValueAtTime(
				frequency,
				startTime
			);

			gain.gain.setValueAtTime(
				volume,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + duration
			);

			oscillator.connect(gain);
			gain.connect(audioContext.destination);

			oscillator.start(startTime);
			oscillator.stop(startTime + duration);
		}

		function playButtonBeeps() {
			playTone(900, 0.075, 0, "square", 0.032);
			playTone(1180, 0.085, 0.1, "square", 0.028);
		}

		function getTerminalNoiseBuffer() {
			ensureAudioContext();

			if (terminalNoiseBuffer) {
				return terminalNoiseBuffer;
			}

			const duration = 0.045;
			const frameCount = Math.floor(
				audioContext.sampleRate * duration
			);

			terminalNoiseBuffer =
				audioContext.createBuffer(
					1,
					frameCount,
					audioContext.sampleRate
				);

			const channel =
				terminalNoiseBuffer.getChannelData(0);

			for (
				let index = 0;
				index < frameCount;
				index += 1
			) {
				const progress =
					index / frameCount;

				const decay =
					Math.pow(1 - progress, 4);

				channel[index] =
					(Math.random() * 2 - 1) *
					decay;
			}

			return terminalNoiseBuffer;
		}

		function playTerminalNoiseClick(
			delay = 0,
			volume = 0.006
		) {
			ensureAudioContext();

			const startTime =
				audioContext.currentTime + delay;

			const source =
				audioContext.createBufferSource();

			const bandPass =
				audioContext.createBiquadFilter();

			const highPass =
				audioContext.createBiquadFilter();

			const gain =
				audioContext.createGain();

			source.buffer =
				getTerminalNoiseBuffer();

			bandPass.type = "bandpass";
			bandPass.frequency.setValueAtTime(
				2350 + Math.random() * 900,
				startTime
			);
			bandPass.Q.setValueAtTime(
				1.4,
				startTime
			);

			highPass.type = "highpass";
			highPass.frequency.setValueAtTime(
				900,
				startTime
			);

			gain.gain.setValueAtTime(
				volume,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + 0.032
			);

			source.connect(bandPass);
			bandPass.connect(highPass);
			highPass.connect(gain);
			gain.connect(audioContext.destination);

			source.start(startTime);
			source.stop(startTime + 0.04);
		}

		function playTerminalGlyphSound(step) {
			ensureAudioContext();

			const pattern = [
				0,
				42,
				-26,
				73,
				15,
				-38,
				55
			];

			const baseFrequency =
				620 +
				pattern[
					step % pattern.length
				];

			const startTime =
				audioContext.currentTime;

			const oscillator =
				audioContext.createOscillator();

			const lowPass =
				audioContext.createBiquadFilter();

			const gain =
				audioContext.createGain();

			oscillator.type = "square";

			oscillator.frequency.setValueAtTime(
				baseFrequency + 145,
				startTime
			);

			oscillator.frequency.exponentialRampToValueAtTime(
				baseFrequency,
				startTime + 0.026
			);

			lowPass.type = "lowpass";
			lowPass.frequency.setValueAtTime(
				1850,
				startTime
			);
			lowPass.Q.setValueAtTime(
				0.7,
				startTime
			);

			gain.gain.setValueAtTime(
				0.0105,
				startTime
			);

			gain.gain.exponentialRampToValueAtTime(
				0.001,
				startTime + 0.031
			);

			oscillator.connect(lowPass);
			lowPass.connect(gain);
			gain.connect(audioContext.destination);

			oscillator.start(startTime);
			oscillator.stop(startTime + 0.034);

			playTerminalNoiseClick(
				0,
				0.0055
			);

			if (step % 7 === 0) {
				playTone(
					baseFrequency + 260,
					0.016,
					0.024,
					"square",
					0.0045
				);

				playTerminalNoiseClick(
					0.022,
					0.0035
				);
			}
		}

		function playCompleteSound() {
			playTone(520, 0.12, 0, "sine", 0.04);
			playTone(690, 0.14, 0.09, "sine", 0.042);
			playTone(920, 0.19, 0.2, "sine", 0.038);
		}

		function getRandomSymbol() {
			return scrambleSymbols[
				Math.floor(
					Math.random() *
					scrambleSymbols.length
				)
			];
		}

		function shouldKeepCharacter(character) {
			return (
				character === " " ||
				character === "\n" ||
				/[，。！？、：；「」『』（）【】0-9]/.test(
					character
				)
			);
		}

		function buildScrambledText(
			characters,
			revealedCount
		) {
			return characters
				.map(function (character, index) {
					if (
						index < revealedCount ||
						shouldKeepCharacter(character)
					) {
						return character;
					}

					return getRandomSymbol();
				})
				.join("");
		}

		function renderDecodeScreen(
			scrambledText,
			progress
		) {
			const percent = String(
				Math.floor(progress * 100)
			).padStart(3, "0");

			terminalOutput.textContent =
				"[HERMES] 指令封包已接收\n" +
				"[DECODE] 解密進度：" +
				percent +
				"%\n\n" +
				scrambledText;
		}

		async function decodeCommand(command) {
			const completeText =
				"【本次指令】\n" + command;

			const characters =
				Array.from(completeText);

			const totalFrames =
				Math.max(
					54,
					characters.length * 2
				);

			terminalOutput.classList.add("decoding");

			for (
				let frame = 0;
				frame <= totalFrames;
				frame += 1
			) {
				const progress =
					frame / totalFrames;

				const easedProgress =
					1 -
					Math.pow(
						1 - progress,
						2.35
					);

				const revealedCount =
					Math.floor(
						easedProgress *
						characters.length
					);

				renderDecodeScreen(
					buildScrambledText(
						characters,
						revealedCount
					),
					progress
				);

				if (frame % 2 === 0) {
					playTerminalGlyphSound(
						Math.floor(frame / 2)
					);
				}

				await wait(
					30 + Math.random() * 20
				);
			}

			terminalOutput.classList.remove("decoding");

			terminalOutput.textContent =
				"[HERMES] 解密完成\n" +
				"[STATUS] 指令已正式生效\n\n" +
				completeText;

			const cursor =
				document.createElement("span");

			cursor.className = "cursor";
			terminalOutput.appendChild(cursor);

			playCompleteSound();
		}

		viewButton.addEventListener(
			"click",
			async function () {
				if (isDecoding) return;

				const command =
					getUnusedCommand();

				if (!command) {
					updateCounter();
					return;
				}

				isDecoding = true;
				viewButton.disabled = true;
				viewButton.textContent = "接收中...";

				statusText.textContent =
					"赫爾墨斯協議：正在接收未知封包...";

				playButtonBeeps();

				flash.classList.remove("active");
				void flash.offsetWidth;
				flash.classList.add("active");

				terminalOutput.classList.add("visible");
				terminalOutput.textContent =
					"[SIGNAL] 偵測到未知封包...\n" +
					"[STATUS] 正在建立解密程序...";

				await wait(520);
				await decodeCommand(command);

				statusText.textContent =
					"赫爾墨斯協議：等待下一次調用。";

				viewButton.textContent =
					"查看下一項指令";

				viewButton.disabled = false;
				isDecoding = false;

				updateCounter();
			}
		);

		symbolImage.addEventListener("error", function () {
			symbolImage.style.display = "none";
			symbolFallback.style.display = "block";
		});

		updateVisitCount();
		updateCounter();
	</script>
</body>
